# nginx proxy address - http://172.17.0.1:64386

name: whois
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: dumbwareio/dumbwhois:latest
    container_name: whois-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: whois-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DUMBWHOIS_SITE_TITLE: ${APP_ORG_NAME:-DumbWhois}
      DUMBWHOIS_ALLOWED_ORIGINS: ${DUMBWHOIS_ALLOWED_ORIGINS:-*}
    ports:
      - '172.17.0.1:64386:3000'
    networks:
      - whois

networks:
  whois:
    name: whois
    external: false
