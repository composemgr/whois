name: whois
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: dumbwareio/dumbwhois:latest
    container_name: whois-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: whois-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DUMBWHOIS_SITE_TITLE: ${APP_ORG_NAME:-DumbWhois}
      DUMBWHOIS_ALLOWED_ORIGINS: ${DUMBWHOIS_ALLOWED_ORIGINS:-*}
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://whois-app:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - whois
      - cloudflare

networks:
  whois:
    name: whois
    external: false
  cloudflare:
    external: true
